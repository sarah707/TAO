<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <circle cx="50" cy="50" r="45" fill="#F3E5F5"/>
  <!-- 尾部喷火 -->
  <path d="M 40 70 L 50 95 L 60 70 Z" fill="#FFD54F" stroke="#4A148C" stroke-width="3" stroke-linejoin="round"/>
  <!-- 火箭左翼 -->
  <path d="M 35 55 L 18 75 L 35 70 Z" fill="#BA68C8" stroke="#4A148C" stroke-width="3" stroke-linejoin="round"/>
  <!-- 火箭右翼 -->
  <path d="M 65 55 L 82 75 L 65 70 Z" fill="#BA68C8" stroke="#4A148C" stroke-width="3" stroke-linejoin="round"/>
  <!-- 火箭主体 -->
  <path d="M 50 12 C 75 30 70 70 65 75 L 35 75 C 30 70 25 30 50 12 Z" fill="#E1BEE7" stroke="#4A148C" stroke-width="3" stroke-linejoin="round"/>
  <!-- 火箭舷窗 -->
  <circle cx="50" cy="40" r="12" fill="#F3E5F5" stroke="#4A148C" stroke-width="3"/>
  <!-- 舷窗里的笑脸 -->
  <circle cx="46" cy="38" r="2" fill="#4A148C"/>
  <circle cx="54" cy="38" r="2" fill="#4A148C"/>
  <path d="M 47 42 Q 50 46 53 42" stroke="#4A148C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 火箭底部装饰线 -->
  <line x1="38" y1="65" x2="62" y2="65" stroke="#4A148C" stroke-width="3" stroke-linecap="round"/>
  <!-- 升空特效星光 -->
  <circle cx="25" cy="30" r="2.5" fill="#CE93D8"/>
  <circle cx="75" cy="25" r="2.5" fill="#CE93D8"/>
</svg>