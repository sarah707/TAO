<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <circle cx="50" cy="50" r="48" fill="#EF4444" />
  
  <g stroke="#7F1D1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor Base -->
    <path d="M 40 80 L 60 80 L 55 70 L 45 70 Z" fill="#FCA5A5" />
    <line x1="30" y1="80" x2="70" y2="80" stroke-width="4" />
    
    <!-- Monitor Screen -->
