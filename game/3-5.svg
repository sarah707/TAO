    <circle cx="62" cy="55" r="5" fill="#FECACA" />
    <line x1="43" y1="55" x2="57" y2="55" />
    
    <!-- Eyes -->
    <circle cx="38" cy="55" r="1.5" fill="#7F1D1D" stroke="none" />
