<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <circle cx="50" cy="50" r="48" fill="#C084FC" />
  
  <g stroke="#4C1D95" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Target -->
    <circle cx="45" cy="55" r="32" fill="#FFFFFF" />
    <circle cx="45" cy="55" r="22" fill="#D8B4FE" />
    <circle cx="45" cy="55" r="12" fill="#9333EA" />
    
    <!-- Golden Arrow (Hitting Bullseye) -->
    <line x1="80" y1="20" x2="52" y2="48" stroke="#FDE047" stroke-width="4" />
    <path d="M 80 20 L 85 25 L 75 35 L 70 30 Z" fill="#F87171" stroke-width="2" /> <!-- Feather -->
    <path d="M 50 50 L 52 45 L 57 47 Z" fill="#FDE047" /> <!-- Arrowhead -->

    <!-- Confident Winking Face on the Bullseye -->
    <path d="M 40 52 Q 42 50 44 52" fill="none" stroke="#FFFFFF" /> <!-- Winking Eye -->
    <circle cx="49" cy="53" r="1.5" fill="#FFFFFF" stroke="none" /> <!-- Open Eye -->
    <ellipse cx="38" cy="55" rx="2" ry="1.5" fill="#F9A8D4" stroke="none" />
    <ellipse cx="52" cy="55" rx="2" ry="1.5" fill="#F9A8D4" stroke="none" />
    <path d="M 43 57 Q 45 60 47 57" fill="none" stroke="#FFFFFF" />
  </g>
</svg>