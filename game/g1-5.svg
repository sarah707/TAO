<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <circle cx="50" cy="50" r="45" fill="#FFF0F5"/>
  <!-- 写字板 -->
  <rect x="25" y="20" width="50" height="65" rx="5" fill="#FFB6C1" stroke="#C2185B" stroke-width="3"/>
  <!-- 报告纸张 -->
  <rect x="30" y="30" width="40" height="50" rx="2" fill="#FFF" stroke="#C2185B" stroke-width="3"/>
  <!-- 板夹 -->
  <rect x="40" y="15" width="20" height="10" rx="3" fill="#FF69B4" stroke="#C2185B" stroke-width="3"/>
  <!-- 巨大的验证通过符号 (对号) -->
  <path d="M 40 50 L 48 58 L 65 38" fill="none" stroke="#FF1493" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 纸张文字线 -->
  <line x1="35" y1="40" x2="45" y2="40" stroke="#C2185B" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="70" x2="65" y2="70" stroke="#C2185B" stroke-width="2" stroke-linecap="round"/>
  <!-- 纸张底部的可爱表情 -->
  <circle cx="43" cy="62" r="2" fill="#C2185B"/>
  <circle cx="57" cy="62" r="2" fill="#C2185B"/>
  <path d="M 48 65 Q 50 68 52 65" stroke="#C2185B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="39" cy="64" r="2.5" fill="#FFB6C1"/>
  <circle cx="61" cy="64" r="2.5" fill="#FFB6C1"/>
</svg>