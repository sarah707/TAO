<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <circle cx="50" cy="50" r="48" fill="#FECACA" />
  
  <g stroke="#7F1D1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clipboard Base -->
    <rect x="25" y="20" width="50" height="65" rx="4" fill="#FCA5A5" />
    
    <!-- Paper -->
    <rect x="30" y="30" width="40" height="50" fill="#FFFFFF" />
    
    <!-- Clip -->
    <rect x="40" y="15" width="20" height="10" rx="2" fill="#E5E7EB" />
    <circle cx="50" cy="20" r="2" fill="#7F1D1D" stroke="none" />

    <!-- Checkmarks & Lines -->
    <path d="M 35 40 L 38 43 L 45 35" fill="none" stroke="#F87171" stroke-width="3" />
    <line x1="50" y1="40" x2="65" y2="40" />
    
    <!-- Focused Face (Tongue sticking out slightly) -->
    <circle cx="42" cy="55" r="2" fill="#7F1D1D" stroke="none" />
    <circle cx="58" cy="55" r="2" fill="#7F1D1D" stroke="none" />
    <ellipse cx="36" cy="58" rx="2.5" ry="1.5" fill="#F9A8D4" stroke="none" />
    <ellipse cx="64" cy="58" rx="2.5" ry="1.5" fill="#F9A8D4" stroke="none" />
    <line x1="47" y1="59" x2="53" y2="59" />
    <path d="M 49 59 v 2 a 1 1 0 0 0 2 0 v -2" fill="#F87171" stroke="none" />
  </g>
</svg>