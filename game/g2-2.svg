<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <circle cx="50" cy="50" r="45" fill="#E1F5FE"/>
  <!-- 写字板背板 -->
  <rect x="25" y="20" width="50" height="65" rx="5" fill="#4FC3F7" stroke="#01579B" stroke-width="3"/>
  <!-- 纸张 -->
  <rect x="30" y="30" width="40" height="50" rx="2" fill="#FFF" stroke="#01579B" stroke-width="3"/>
  <!-- 顶部铁夹 -->
  <rect x="40" y="15" width="20" height="10" rx="3" fill="#03A9F4" stroke="#01579B" stroke-width="3"/>
  <!-- 勾选框和横线 -->
  <rect x="35" y="38" width="6" height="6" rx="1" fill="#B3E5FC" stroke="#01579B" stroke-width="2"/>
  <line x1="45" y1="41" x2="65" y2="41" stroke="#01579B" stroke-width="2" stroke-linecap="round"/>
  <rect x="35" y="50" width="6" height="6" rx="1" fill="#B3E5FC" stroke="#01579B" stroke-width="2"/>
  <line x1="45" y1="53" x2="60" y2="53" stroke="#01579B" stroke-width="2" stroke-linecap="round"/>
  <!-- 蓝色的对号 -->
  <path d="M 34 39 L 37 42 L 43 35" fill="none" stroke="#03A9F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 纸张底部的表情 -->
  <circle cx="43" cy="68" r="2" fill="#01579B"/>
  <circle cx="57" cy="68" r="2" fill="#01579B"/>
  <path d="M 48 71 Q 50 74 52 71" stroke="#01579B" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>