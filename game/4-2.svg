<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <circle cx="50" cy="50" r="48" fill="#E9D5FF" />
  
  <g stroke="#4C1D95" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spiral Notebook -->
    <rect x="25" y="25" width="50" height="55" rx="3" fill="#FFFFFF" />
    
    <!-- Spiral Bindings -->
    <circle cx="35" cy="20" r="3" fill="#D8B4FE" />
    <line x1="35" y1="23" x2="35" y2="28" />
    <circle cx="50" cy="20" r="3" fill="#D8B4FE" />
    <line x1="50" y1="23" x2="50" y2="28" />
    <circle cx="65" cy="20" r="3" fill="#D8B4FE" />
    <line x1="65" y1="23" x2="65" y2="28" />

    <!-- Text Lines -->
    <line x1="35" y1="38" x2="45" y2="38" stroke="#D8B4FE" stroke-width="4" />
    <line x1="35" y1="46" x2="50" y2="46" stroke="#D8B4FE" stroke-width="4" />

    <!-- Focused Face -->
    <circle cx="42" cy="60" r="2" fill="#4C1D95" stroke="none" />
    
    <!-- Monocle (Right Eye) -->
    <circle cx="58" cy="60" r="6" fill="#F3E8FF" />
    <circle cx="58" cy="60" r="2" fill="#4C1D95" stroke="none" />
    <line x1="64" y1="62" x2="72" y2="70" /> <!-- Monocle Chain -->
    
    <ellipse cx="36" cy="63" rx="2" ry="1.5" fill="#F9A8D4" stroke="none" />
    <path d="M 46 65 Q 50 67 54 65" fill="none" />
  </g>
</svg>