<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <circle cx="50" cy="50" r="48" fill="#FCA5A5" />
  
  <g stroke="#7F1D1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chart Background Board -->
    <rect x="15" y="20" width="70" height="60" rx="4" fill="#FFFFFF" />
    
    <!-- X/Y Axes -->
    <line x1="25" y1="25" x2="25" y2="70" />
    <line x1="25" y1="70" x2="80" y2="70" />
    
    <!-- Bars -->
    <rect x="32" y="50" width="12" height="20" fill="#FECACA" />
    <rect x="50" y="35" width="12" height="35" fill="#F87171" />
    <rect x="68" y="20" width="12" height="50" fill="#EF4444" />
    
    <!-- Floating Happy Face on the Chart -->
    <path d="M 38 35 Q 41 32 44 35" fill="none" /> <!-- Winking eye -->
    <circle cx="56" cy="35" r="2" fill="#7F1D1D" stroke="none" /> <!-- Open eye -->
    <ellipse cx="34" cy="39" rx="3" ry="1.5" fill="#F9A8D4" stroke="none" />
    <ellipse cx="60" cy="39" rx="3" ry="1.5" fill="#F9A8D4" stroke="none" />
    <path d="M 45 40 Q 48 45 51 40" fill="none" stroke-width="2" />
  </g>
</svg>