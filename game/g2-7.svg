<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <circle cx="50" cy="50" r="45" fill="#E0F7FA"/>
  <!-- 展开的蓝图纸张 -->
  <path d="M 28 35 Q 50 25 72 35 L 72 75 Q 50 65 28 75 Z" fill="#FFF" stroke="#01579B" stroke-width="3" stroke-linejoin="round"/>
  <!-- 蓝图卷轴左右两边 -->
  <rect x="20" y="30" width="8" height="50" rx="4" fill="#03A9F4" stroke="#01579B" stroke-width="3"/>
  <rect x="72" y="30" width="8" height="50" rx="4" fill="#03A9F4" stroke="#01579B" stroke-width="3"/>
  <!-- 纸张上的蓝色科技纹理 (网格线隐喻) -->
  <line x1="35" y1="45" x2="65" y2="45" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="55" y2="50" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="35" x2="45" y2="70" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round"/>
  <!-- 顶部的最高级金色小皇冠 -->
  <path d="M 42 15 L 46 25 L 50 13 L 54 25 L 58 15 L 60 29 L 40 29 Z" fill="#FFD54F" stroke="#01579B" stroke-width="2" stroke-linejoin="round"/>
  <!-- 蓝图中间的自信笑脸 -->
  <circle cx="44" cy="58" r="2.5" fill="#01579B"/>
  <circle cx="56" cy="58" r="2.5" fill="#01579B"/>
  <path d="M 48 62 Q 50 66 52 62" stroke="#01579B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="60" r="3" fill="#FF8A80" opacity="0.6"/>
  <circle cx="62" cy="60" r="3" fill="#FF8A80" opacity="0.6"/>
</svg>